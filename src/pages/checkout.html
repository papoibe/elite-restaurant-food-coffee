<!-- ===== TRANG CHECKOUT — PHỤ TRÁCH: KIỆT ===== -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thanh toán đơn hàng tại Elite Restaurant" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Checkout — Foodtuck</title>
</head>
<body class="bg-bg-light dark:bg-bg-dark text-text-dark dark:text-text-white">
  <header><!-- HEADER --></header>
  
  <main>
    <section class="page-banner">
      <h1>Checkout Page</h1>
      <nav class="breadcrumb">Home &gt; <span class="current">Checkout</span></nav>
    </section>

    <section class="py-24 px-6">
      <div class="max-w-[1320px] mx-auto">
        <form id="checkout-form" class="grid grid-cols-1 lg:grid-cols-12 gap-8" novalidate>
          
          <div class="lg:col-span-8 space-y-5">
            <h2 class="text-xl font-bold mb-4">Shipping Address</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">First name</label>
                <input type="text" name="firstName" data-validate="required" class="w-full border border-gray-300 dark:border-gray-700 p-3 rounded focus:outline-none focus:border-primary dark:bg-bg-dark-2" />
                <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">Last name</label>
                <input type="text" name="lastName" data-validate="required" class="w-full border border-gray-300 dark:border-gray-700 p-3 rounded focus:outline-none focus:border-primary dark:bg-bg-dark-2" />
                <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">Email address</label>
                <input type="email" name="email" data-validate="required,email" class="w-full border border-gray-300 dark:border-gray-700 p-3 rounded focus:outline-none focus:border-primary dark:bg-bg-dark-2" />
                <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">Phone number</label>
                <input type="tel" name="phone" data-validate="required,phone" class="w-full border border-gray-300 dark:border-gray-700 p-3 rounded focus:outline-none focus:border-primary dark:bg-bg-dark-2" />
                <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">Company</label>
                <input type="text" name="company" class="w-full border border-gray-300 dark:border-gray-700 p-3 rounded focus:outline-none focus:border-primary dark:bg-bg-dark-2" />
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">Country</label>
                <select name="country" data-validate="required" class="w-full border border-gray-300 dark:border-gray-700 p-3 rounded focus:outline-none focus:border-primary dark:bg-bg-dark-2 text-text-muted">
                  <option value="">Choose country</option>
                  <option value="VN">Vietnam</option>
                  <option value="US">United States</option>
                </select>
                <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">City</label>
                <select name="city" data-validate="required" class="w-full border border-gray-300 dark:border-gray-700 p-3 rounded focus:outline-none focus:border-primary dark:bg-bg-dark-2 text-text-muted">
                  <option value="">Choose city</option>
                  <option value="HCM">Ho Chi Minh</option>
                  <option value="HN">Ha Noi</option>
                </select>
                <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">Zip code</label>
                <input type="text" name="zipCode" data-validate="required" class="w-full border border-gray-300 dark:border-gray-700 p-3 rounded focus:outline-none focus:border-primary dark:bg-bg-dark-2" />
                <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">Address 1</label>
                <input type="text" name="address1" data-validate="required" class="w-full border border-gray-300 dark:border-gray-700 p-3 rounded focus:outline-none focus:border-primary dark:bg-bg-dark-2" />
                <p class="error-message text-red-500 text-xs mt-1 hidden"></p>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">Address 2</label>
                <input type="text" name="address2" class="w-full border border-gray-300 dark:border-gray-700 p-3 rounded focus:outline-none focus:border-primary dark:bg-bg-dark-2" />
              </div>
            </div>

            <div class="pt-2">
              <h3 class="text-base font-bold mb-2">Billing Address</h3>
              <label class="flex items-center gap-2 cursor-pointer text-sm text-text-muted">
                <input type="checkbox" name="sameAddress" checked class="w-4 h-4 accent-primary rounded" />
                <span>Same as shipping address</span>
              </label>
            </div>

            <div class="flex justify-between items-center pt-4 gap-4">
              <a href="cart.html" class="w-1/2 border border-gray-300 dark:border-gray-700 text-center py-3 rounded text-sm hover:bg-gray-50 dark:hover:bg-bg-dark-2 transition">
                &lt; Back to cart
              </a>
              <button type="submit" class="btn-primary w-1/2 py-3 rounded text-sm flex items-center justify-center gap-2">
                <span>Proceed to shipping</span>
                <span>→</span>
              </button>
            </div>
          </div>

          <div class="lg:col-span-4 border border-gray-200 dark:border-gray-700 p-6 rounded h-fit space-y-4">
            <h3 class="text-base font-bold mb-2">Order Summary</h3>

            <div id="checkout-cart-list" class="space-y-4 max-h-[280px] overflow-y-auto divide-y divide-gray-100 dark:divide-gray-800">

            </div>

            <hr class="border-gray-200 dark:border-gray-700" />

            <div class="space-y-2 text-xs text-text-muted">
              <div class="flex justify-between">
                <span>Sub-total</span>
                <span id="summary-subtotal" class="font-medium text-gray-800 dark:text-gray-200">$0.00</span>
              </div>
              <div class="flex justify-between">
                <span>Shipping</span>
                <span class="font-medium text-gray-800 dark:text-gray-200">Free</span>
              </div>
              <div class="flex justify-between">
                <span>Discount</span>
                <span class="font-medium text-gray-800 dark:text-gray-200">0%</span>
              </div>
              <div class="flex justify-between">
                <span>Tax (10%)</span>
                <span id="summary-tax" class="font-medium text-gray-800 dark:text-gray-200">$0.00</span>
              </div>
              
              <hr class="border-gray-200 dark:border-gray-700 my-2" />
              
              <div class="flex justify-between font-bold text-sm text-gray-900 dark:text-white pt-1">
                <span>Total</span>
                <span id="summary-total" class="text-primary">$0.00</span>
              </div>
            </div>

            <button id="btn-place-order" type="button" class="btn-primary w-full py-3 rounded text-sm flex items-center justify-center gap-2 mt-4">
              <span>Place an order</span>
              <span>→</span>
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer><!-- FOOTER --></footer>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/checkout.js"></script>
</body>
</html>
