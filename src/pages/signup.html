<!-- ===== TRANG SIGN UP — PHỤ TRÁCH: KIỆT ===== -->
<!-- Chỉnh sửa bởi Nhóm trưởng: Thêm Header/Footer + Logic auth.js -->
<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Đăng ký tài khoản Elite Restaurant" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Sign Up — Foodtuck</title>
</head>
<body class="bg-bg-dark text-text-white">

  <!-- ========== HEADER ========== -->
  <header class="fixed top-0 w-full z-50 bg-bg-dark/95 backdrop-blur-sm">
    <nav class="max-w-[1320px] mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-2xl font-bold font-heading">Food<span class="text-primary">tuck</span></a>
      <ul class="hidden lg:flex items-center gap-8 text-sm">
        <li><a href="/" class="hover:text-primary transition-colors">Home</a></li>
        <li><a href="/src/pages/menu.html" class="hover:text-primary transition-colors">Menu</a></li>
        <li><a href="/src/pages/about.html" class="hover:text-primary transition-colors">About</a></li>
        <li><a href="/src/pages/shop-list.html" class="hover:text-primary transition-colors">Shop</a></li>
        <li><a href="/src/pages/contact.html" class="hover:text-primary transition-colors">Contact</a></li>
      </ul>
      <div class="flex items-center gap-4">
        <a href="/src/pages/cart.html" class="relative p-2 hover:text-primary transition-colors" aria-label="Giỏ hàng">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
        </a>
      </div>
    </nav>
  </header>

  <main class="pt-20">
    <!-- Banner -->
    <section class="page-banner" style="background-image:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url('/assets/images/banner-bg.jpg');background-size:cover;background-position:center;padding:80px 0;text-align:center;">
      <h1 class="text-5xl font-bold text-white font-heading">Sign Up</h1>
      <nav class="breadcrumb mt-3"><a href="/">Home</a> &gt; <span class="current">Sign Up</span></nav>
    </section>

    <!-- FORM ĐĂNG KÝ — Kết nối auth.js, lưu vào localStorage JSON -->
    <section class="py-24 px-6 bg-white">
      <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-[0_4px_25px_rgba(0,0,0,0.15)]">
        <h2 class="text-xl font-bold mb-6 text-left text-gray-900">Sign Up</h2>
        
        <!-- Thông báo kết quả -->
        <div id="signup-alert" class="hidden mb-4 p-3 rounded text-sm font-medium"></div>
        
        <form id="signup-form" class="space-y-4">
          <!-- Tên -->
          <div>
            <label for="signup-name" class="block text-xs font-semibold mb-1 text-gray-600">Name</label>
            <input type="text" id="signup-name" placeholder="Enter your name" required
                   class="w-full px-4 py-2 border border-gray-300 rounded bg-transparent focus:outline-none focus:border-primary text-sm text-gray-900">
          </div>

          <!-- Email -->
          <div>
            <label for="signup-email" class="block text-xs font-semibold mb-1 text-gray-600">Email</label>
            <input type="email" id="signup-email" placeholder="Enter your email" required
                   class="w-full px-4 py-2 border border-gray-300 rounded bg-transparent focus:outline-none focus:border-primary text-sm text-gray-900">
          </div>

          <!-- Mật khẩu -->
          <div>
            <label for="signup-password" class="block text-xs font-semibold mb-1 text-gray-600">Password</label>
            <input type="password" id="signup-password" placeholder="Min 6 characters" required
                   class="w-full px-4 py-2 border border-gray-300 rounded bg-transparent focus:outline-none focus:border-primary text-sm text-gray-900">
          </div>

          <!-- Xác nhận mật khẩu -->
          <div>
            <label for="signup-confirm" class="block text-xs font-semibold mb-1 text-gray-600">Confirm Password</label>
            <input type="password" id="signup-confirm" placeholder="Re-enter password" required
                   class="w-full px-4 py-2 border border-gray-300 rounded bg-transparent focus:outline-none focus:border-primary text-sm text-gray-900">
          </div>

          <!-- Nút Submit -->
          <button type="submit" class="w-full bg-primary hover:bg-amber-600 text-white font-semibold py-2.5 rounded text-sm transition duration-200 mt-2 cursor-pointer">
            Sign Up
          </button>
        </form>

        <p class="text-center text-xs text-gray-500 mt-6">
          Already have an account? <a href="signin.html" class="text-primary hover:underline font-medium">Sign In here</a>
        </p>
      </div>
    </section>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="bg-bg-dark border-t border-white/10 pt-16 pb-8 px-6">
    <div class="max-w-[1320px] mx-auto">
      <div class="border-t border-white/10 mt-12 pt-6 text-center text-text-muted text-xs">
        <p>Copyright &copy; 2026 by Elite Restaurant. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <script type="module" src="/src/js/main.js"></script>
  <script type="module">
    // Import module auth để xử lý đăng ký bằng localStorage JSON
    import { register } from '/src/js/auth.js'

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signup-form')
      const alertBox = document.getElementById('signup-alert')

      form.addEventListener('submit', (e) => {
        e.preventDefault()

        const name = document.getElementById('signup-name').value.trim()
        const email = document.getElementById('signup-email').value.trim()
        const password = document.getElementById('signup-password').value
        const confirm = document.getElementById('signup-confirm').value

        // Kiểm tra confirm password trùng khớp
        if (password !== confirm) {
          alertBox.classList.remove('hidden')
          alertBox.className = 'mb-4 p-3 rounded text-sm font-medium bg-red-100 text-red-700'
          alertBox.textContent = 'Mật khẩu xác nhận không khớp!'
          return
        }

        // Gọi hàm register từ auth.js — lưu vào localStorage
        const result = register(name, email, password)

        alertBox.classList.remove('hidden')
        if (result.success) {
          alertBox.className = 'mb-4 p-3 rounded text-sm font-medium bg-green-100 text-green-700'
          alertBox.textContent = result.message
          form.reset()
          // Chuyển sang trang đăng nhập sau 2s
          setTimeout(() => { window.location.href = 'signin.html' }, 2000)
        } else {
          alertBox.className = 'mb-4 p-3 rounded text-sm font-medium bg-red-100 text-red-700'
          alertBox.textContent = result.message
        }
      })
    })
  </script>
</body>
</html>
